[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redwall"
dynamic = ["version"]
description = "Open-source, local-first security scanner: fast deterministic rules first, LLM verification later."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
redwall = "redwall.cli:main"

[project.urls]
Homepage = "https://github.com/isaergisi/RedWall"

[tool.setuptools.dynamic]
version = { attr = "redwall.__version__" }

[tool.setuptools.packages.find]
include = ["redwall*"]

[tool.setuptools.package-data]
redwall = ["rules/opengrep/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
